<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Attendance: instructor page</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 14px; }
    .banner { padding: 9px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .banner.ok { background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4; }
    .banner.note { background: #fff4d6; color: #6b4e00; border: 1px solid #ecd58f; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
    th { border-top: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    /* the attendance grid: as narrow as its content, vertical headers centered over the cells */
    table.grid { width: auto; }
    table.grid td.name { padding: 2px 10px 2px 4px; line-height: 1.25; }
    table.grid td.name .muted { font-size: 12px; }
    table.grid th.v { text-align: center; vertical-align: bottom; padding: 4px 0 3px; font-weight: 500; font-size: 12px; }
    table.grid th.v span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); line-height: 1.1; }
    table.grid th.v.open { color: var(--ok); font-weight: 700; }
    table.grid th.v.out, table.grid td.out { color: #b0b6bd; }
    /* the "Exclude dates" row: one dark-blue checkbox per round; checked = the date counts */
    table.grid tr.excl td { padding: 2px 1px 4px; text-align: center; background: #eef4fb; border-top: 1px solid var(--line); }
    table.grid tr.excl td.name { text-align: left; color: var(--accent); font-weight: 600; }
    table.grid tr.excl input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; cursor: pointer; display: block; margin: 0 auto; }
    table.grid tr.rem td { background: #fcefee; }
    table.grid tr.rem td.name { color: var(--warn); }
    table.grid tr.rem input { accent-color: var(--warn); }
    table.grid th.v.out span { text-decoration: line-through; }
    table.grid td.out button { opacity: .45; }
    table.grid td.total { text-align: center; padding: 2px 4px; }
    td.mark { text-align: center; padding: 1px; }
    td.mark button { width: 20px; height: 20px; padding: 0; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: transparent; font-size: 11px; display: block; }
    td.mark button.on { background: #dff3e4; border-color: var(--ok); color: var(--ok); font-weight: 700; }
    td.mark button.inst { background: #fff0b3; border-color: #b58900; color: #6b4e00; font-weight: 700; }
    td.mark button.rev { background: #fde2e2; border-color: #c0392b; color: #c0392b; font-weight: 700; }
    td.mark button.pend { outline: 2px dashed var(--accent); outline-offset: 1px; }
    td.mark button:disabled { opacity: 1; cursor: default; }
    td.mark button.lock { cursor: not-allowed; }
    button.view { background: #fff; color: var(--ink); border-color: var(--line); padding: 3px 10px; }
    button.view.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .savebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    td.total { text-align: right; font-weight: 600; }
    button { font: inherit; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: #fff; color: var(--accent); }
    button.danger { background: #fff; color: var(--warn); border-color: var(--warn); }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
    button.tab { background: #fff; color: var(--ink); border-color: var(--line); }
    button.tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    input, select, textarea { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
    textarea { min-height: 60px; width: 100%; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0 0 12px; align-items: center; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
    .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; vertical-align: -2px; }
    .swatch.on { background: #dff3e4; border-color: var(--ok); }
    .swatch.inst { background: #fff0b3; border-color: #b58900; }
    .swatch.rev { background: #fde2e2; border-color: #c0392b; }
    .veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center;
            justify-content: center; padding: 16px; z-index: 10; }
    .modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 480px;
             box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
    .modal h2 { margin-bottom: 8px; }
    .modal p { margin: 0 0 8px; }
    .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button.danger.solid { background: var(--warn); color: #fff; }
    .qrveil { background: #fff; flex-direction: column; cursor: pointer; text-align: center; }
    .qrveil h1 { font-size: 34px; margin: 0 0 12px; }
    .qr { width: min(70vh, 90vw); height: min(70vh, 90vw); }
    .qr svg { width: 100%; height: 100%; display: block; }
    .qrurl { font-size: 26px; margin: 14px 0 4px; word-break: break-all; }
    .qrstatus { font-size: 22px; margin: 0 0 6px; color: var(--ok); }
    .qrcode { font-size: 44px; font-weight: 700; margin: 6px 0; letter-spacing: 4px; }
    .qrcode small { font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-right: 12px; }
    /* the bar beside the session code: full when a new code appears, empty when it changes (10 seconds) */
    .codebar { display: inline-block; width: 140px; height: 14px; margin-left: 16px; vertical-align: middle; border-radius: 7px; background: #e3e7ec; overflow: hidden; }
    .codebar div { height: 100%; background: var(--accent); border-radius: 7px; }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<script>
  var API = (window.SIGNUP_API || '').replace(/\/+$/, '');
  var TOKEN_KEY = 'signup_token';  // shared with the sign-up instructor page: one sign-in serves both
  var TZ = 'America/New_York';
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var TABS = ['Attendance', 'Questions', 'QR code', 'Reports', 'Log', 'Settings', 'Roster'];
  var token = '', me = '', classes = [], cur = '', D = null, tab = 'Attendance';
  var flash = null, busy = false, timer = null;
  // attendance_admin.html?qr=KEY is the QR screen of that class in its own tab (for the projector); see qrPage.
  var qrMode = new URLSearchParams(location.search).get('qr') || '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || ''; cur = qrMode || sessionStorage.getItem('att_admin_class') || ''; } catch (e) {}

  // ---------------------------------------------------------------- plumbing

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'value') e.value = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? sessionStorage.setItem(TOKEN_KEY, token) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function setClass(key) {
    cur = key || ''; D = null; settingsDraft = null; pending = {}; logRows = null;
    try { sessionStorage.setItem('att_admin_class', cur); } catch (e) {}
  }

  // Every "get" response carries the server's clock; the session codes are computed on the server's time, not the PC's.
  var clockOffset = 0;
  function setD(d) { D = d; if (d && d.now) clockOffset = Date.parse(d.now) - Date.now(); }
  function serverNow() { return Date.now() + clockOffset; }

  // The session code: a copy of sessionCode in worker/src/attendance.js (cyrb53 hash of the class's secret and the 10-second slot).
  var CODE_MS = 10000;
  function sessionCode(secret, slot) {
    var str = String(secret || '') + '|' + slot, h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    var n = 4294967296 * (2097151 & h2) + (h1 >>> 0);
    return String(n % 10000).padStart(4, '0');
  }

  function call(action, args, key) {
    return fetch(API + '/att/admin', { method: 'POST',
      body: JSON.stringify({ token: token, class: key === undefined ? cur : key, action: action, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.ok) return out.data;
        if (out.error === 'SIGNIN') { setToken(''); showSignIn(); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  function fail(e) {
    busy = false;
    if (e.message === 'SIGNIN') return;
    flash = { err: e.message }; render();
  }

  /** Runs one instructor action on the current class and redraws. */
  function run(action, args, okText) {
    busy = true; flash = null;
    call(action, args).then(function (d) {
      busy = false; setD(d); flash = okText ? { ok: okText } : null;
      render();
      if (action === 'saveSettings') refreshClasses();
    }).catch(fail);
  }

  function refreshClasses() {
    call('whoami', [], '').then(function (d) { classes = d.classes; render(); }).catch(function () {});
  }

  function loadClass(quiet) {
    if (!cur) { render(); return; }
    call('get').then(function (d) {
      setD(d);
      // A quiet refresh leaves a form the instructor is typing in alone.
      var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox';
      if (!busy && !(quiet && typing)) render();
    }).catch(function (e) { if (!quiet) fail(e); });
  }

  // While the Attendance tab is shown, the grid refreshes every 10 seconds so marks appear as students press the button;
  // the Questions tab refreshes every 4 seconds so answers appear as they come in.
  function poll() {
    clearTimeout(timer);
    var ms = tab === 'Questions' ? 4000 : 10000;
    timer = setTimeout(function () { if (tab !== 'Settings' && tab !== 'Roster' && tab !== 'Log' && cur && !document.hidden) loadClass(true); poll(); }, ms);
  }

  // Live status of the open window and question: "Open, 4:32 left · 12 of 40 marked". Ticks once a second until the next redraw.
  var tickTimer = null;
  function remaining() { return D && D.open ? Math.max(0, Math.round((Date.parse(D.open.closesAt) - Date.now()) / 1000)) : 0; }
  function mmss(secs) { return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); }
  function statusText() {
    var q = D.state.questions.filter(isOpenQ)[0];
    return (D.open
      ? 'Attendance is OPEN (round of ' + clock(D.open.open) + '), ' + mmss(remaining()) + ' left (until ' + clock(D.open.close) + ') · ' + D.marks.filter(function (m) { return m.round === D.open.id && m.present; }).length + ' of ' + D.state.roster.length + ' marked'
      : 'Attendance is closed' + (D.next ? ' · next: ' + shortDate(D.next.date) + ', ' + clock(D.next.open) + ' to ' + clock(D.next.close) : ' · no upcoming class is scheduled'))
      + (q ? ' · question open: ' + answersOf(q.id).length + ' of ' + D.state.roster.length + ' answered' : '');
  }
  /** A status element that updates itself every second; when the window closes it reloads the class once. */
  function liveStatus(cls) {
    var e = el('div', { class: cls, text: statusText() }), wasOpen = !!D.open;
    clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      if (!document.contains(e)) { clearInterval(tickTimer); return; }
      e.textContent = statusText();
      if (wasOpen && remaining() === 0) { wasOpen = false; loadClass(true); }
    }, 1000);
    return e;
  }

  function start() {
    call('whoami', [], '').then(function (d) {
      me = d.email; classes = d.classes;
      if (!classes.some(function (c) { return c.key === cur; })) setClass(classes.length ? classes[0].key : '');
      loadClass(false); poll();
    }).catch(function (e) {
      if (e.message === 'SIGNIN') return;
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: e.message }));
      app.appendChild(el('p', {}, el('button', { class: 'link', text: 'Sign out', on: { click: signOut } })));
    });
  }

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  function showSignIn() {
    var app = document.getElementById('app'), box = document.getElementById('signin');
    app.innerHTML = '';
    app.appendChild(el('h1', { text: 'Attendance: instructor page' }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with an instructor account.' }));
    box.hidden = false; box.innerHTML = '';
    whenGoogleReady(function () { google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' }); });
  }

  function signOut() {
    if (settingsDirty() || marksDirty()) { leaveDrafts().then(function (go) { if (go) signOut(); }); return; }
    setToken(''); D = null; settingsDraft = null; pending = {};
    whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
    showSignIn();
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/att/config').then(function (r) { return r.json(); }).then(function (c) {
      whenGoogleReady(function () {
        google.accounts.id.initialize({ client_id: c.clientId, callback: function (resp) {
          setToken(resp.credential);
          document.getElementById('signin').hidden = true;
          start();
        } });
      });
      if (token) start(); else showSignIn();
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The attendance service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- helpers

  function clock(hhmm) { var h = Number(hhmm.split(':')[0]), m = hhmm.split(':')[1]; return ((h + 11) % 12 + 1) + ':' + m + (h < 12 ? ' am' : ' pm'); }
  function shortDate(ymd) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(ymd + 'T12:00:00-05:00')); }
  function isoClock(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); }
  function isoFull(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date(iso)); }
  function monthDay(ymd) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' }).format(new Date(ymd + 'T12:00:00-05:00')); }
  function num(x, d) { return (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
  function fullName(r) { return (r.first + ' ' + r.last).trim(); }
  function studentLink() { return location.href.replace(/attendance_admin\.html.*$/, '') + 'attendance.html?c=' + encodeURIComponent(cur); }
  function button(label, cls, fn) { return el('button', { text: label, class: cls, disabled: busy, on: { click: fn } }); }

  function download(name, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }

  /** A confirmation pop-up. Resolves to true when confirmed. */
  /** A dialog with the given buttons [{label, value, cls}]; resolves the chosen value, or null on Cancel, Esc, or a click outside. */
  function choose(title, lines, buttons) {
    return new Promise(function (resolve) {
      var veil;
      var done = function (v) { veil.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(null); };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, el('h2', { text: title }));
      lines.forEach(function (l) { box.appendChild(el('p', { text: l })); });
      var row = el('div', { class: 'buttons' }, el('button', { class: 'plain', text: 'Cancel', on: { click: function () { done(null); } } }));
      var first = null;
      buttons.forEach(function (b) {
        var btn = el('button', { text: b.label, class: b.cls || '', on: { click: function () { done(b.value); } } });
        row.appendChild(btn); first = first || btn;
      });
      box.appendChild(row);
      veil = el('div', { class: 'veil', on: { click: function (ev) { if (ev.target === veil) done(null); } } }, box);
      document.body.appendChild(veil);
      document.addEventListener('keydown', onKey);
      first.focus();
    });
  }

  function ask(title, lines, okLabel, danger) {
    return choose(title, lines, [{ label: okLabel, value: true, cls: danger ? 'danger solid' : '' }]).then(function (v) { return v === true; });
  }

  // Unsaved edits on the Settings tab: kept in settingsDraft across redraws, and checked before the tab or class changes.
  var settingsDraft = null;
  function settingsDirty() { return !!(settingsDraft && D && JSON.stringify(settingsDraft) !== JSON.stringify(settingsOf(D.state))); }
  function settingsOf(S) {
    return { title: S.title, days: S.schedule.days.slice(), open: S.schedule.open, close: S.schedule.close,
             start: S.schedule.start || '', end: S.schedule.end || '', skip: S.skip.join('\n'),
             pointsMode: S.points.mode, points: String(S.points.value), code: !!S.code };
  }
  /** Resolves true when it is fine to leave the Settings form (nothing to save, saved, or discarded), false to stay. */
  function leaveSettings() {
    if (!settingsDirty()) return Promise.resolve(true);
    return choose('Save the settings?', ['You changed the settings but did not save them.'],
      [{ label: "Don't save", value: 'discard', cls: 'plain' }, { label: 'Save', value: 'save' }]).then(function (v) {
      if (v === 'discard') { settingsDraft = null; return true; }
      if (v !== 'save') return false;
      busy = true; flash = null;
      return call('saveSettings', [settingsDraft]).then(function (d) {
        busy = false; setD(d); settingsDraft = null; flash = { ok: 'Settings saved.' }; refreshClasses(); return true;
      }).catch(function (e) { fail(e); return false; });
    });
  }

  // Unsaved cell changes on the Attendance grid: 'round|email' -> true (present) or false (absent). Saved as one batch.
  var pending = {};
  function marksDirty() { return Object.keys(pending).length > 0; }
  function pendingList() { return Object.keys(pending).map(function (k) { var p = k.split('|'); return [p[0], p[1], pending[k]]; }); }
  function sendMarks(list) {
    busy = true; flash = null;
    return call('setMarks', [list]).then(function (d) {
      busy = false; setD(d); pending = {}; flash = { ok: list.length + ' change' + (list.length === 1 ? '' : 's') + ' saved.' }; render(); return true;
    }).catch(function (e) { fail(e); return false; });
  }
  /** The Save button: confirms, then saves every pending cell. */
  function saveMarks() {
    var list = pendingList();
    if (!list.length) return Promise.resolve(true);
    var ups = list.filter(function (x) { return x[2]; }).length;
    return ask('Save ' + list.length + ' change' + (list.length === 1 ? '' : 's') + ' to attendance?',
      [ups + ' to present, ' + (list.length - ups) + ' to absent. Each change is recorded with the time and your account and listed under "Manual changes".'], 'Save', false)
      .then(function (yes) { return yes ? sendMarks(list) : false; });
  }
  function leaveMarks() {
    if (!marksDirty()) return Promise.resolve(true);
    return choose('Save the attendance changes?', ['You changed ' + pendingList().length + ' cell(s) of the grid but did not save them.'],
      [{ label: "Don't save", value: 'discard', cls: 'plain' }, { label: 'Save', value: 'save' }]).then(function (v) {
      if (v === 'discard') { pending = {}; return true; }
      if (v !== 'save') return false;
      return sendMarks(pendingList());
    });
  }
  /** Both drafts (settings form, grid changes) must be saved or discarded before the tab, class, or sign-in changes. */
  function leaveDrafts() { return leaveSettings().then(function (go) { return go ? leaveMarks() : false; }); }
  window.addEventListener('beforeunload', function (ev) { if (settingsDirty() || marksDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

  /** Calls fn once the QR library is loaded (from cdnjs on first use). */
  function withQr(fn) {
    if (window.qrcode) { fn(); return; }
    var sc = el('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',

    var idx = S.questions.indexOf(sel), opts = optionsOf(sel), ans = answersOf(sel.id), isOpen = isOpenQ(sel);
    var left = Math.max(0, Math.round((Date.parse(sel.closes) - Date.now()) / 1000));
    card.appendChild(el('h2', { text: qLabel(sel, idx), style: 'margin-top:18px' }));
    card.appendChild(el('div', { class: 'banner ' + (isOpen ? 'ok' : 'note'), style: 'margin:0 0 10px',
      text: (isOpen ? 'OPEN, closes in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Closed') +
            ' · asked ' + isoClock(sel.opened) + ' · ' + ans.length + ' of ' + roster.length + ' answered' +
            (sel.correct ? ' · correct: ' + sel.correct + ' (' + ans.filter(function (a) { return isRight(sel, a.answer); }).length + ' right)' : '') }));
    // Bars per label; for an open question, per distinct answer (most frequent first, equal answers merged by the matching rule).
    var bars = el('table', { style: 'max-width:520px' });
    var groups;
    if (sel.kind === 'open') {
      groups = [];
      ans.forEach(function (a) {
        var g = groups.filter(function (x) { return isRight({ kind: 'open', correct: x.label }, a.answer); })[0];
        if (g) g.k++; else groups.push({ label: a.answer, k: 1 });
      });
      groups.sort(function (a, b) { return b.k - a.k; });
    } else {
      groups = opts.map(function (o) { return { label: o, k: ans.filter(function (a) { return a.answer === o; }).length }; });
    }
    groups.forEach(function (g) {
      var pct = ans.length ? Math.round(100 * g.k / ans.length) : 0, hit = isRight(sel, g.label);
      bars.appendChild(el('tr', {}, el('td', { style: (sel.kind === 'open' ? 'max-width:240px; white-space:normal' : 'width:60px') + '; font-weight:700' + (hit ? '; color:var(--ok)' : ''), text: g.label + (hit ? ' ✓' : '') }),
        el('td', { style: 'width:100%' }, el('div', { style: 'height:18px; border-radius:4px; background:' + (hit ? '#b9dfc4' : '#c9d9ec') + '; width:' + Math.max(pct, 1) + '%' })),
        el('td', { style: 'text-align:right; white-space:nowrap', text: g.k + ' (' + pct + '%)' })));
    });
    if (sel.kind === 'open' && !groups.length) bars.appendChild(el('tr', {}, el('td', { class: 'muted', text: 'No answer yet.' })));
    card.appendChild(bars);
    var setC;
    if (sel.kind === 'open') { setC = el('input', { type: 'text', maxlength: 200, placeholder: 'none', style: 'width:160px' }); setC.value = sel.correct; }
    else {
      setC = el('select', {}, el('option', { value: '', text: 'no correct answer' }));
      opts.forEach(function (o) { setC.appendChild(el('option', { value: o, text: o })); });
      setC.value = sel.correct;
    }
    var more = el('input', { type: 'number', min: 1, max: 600, value: 1, style: 'width:60px' });
    card.appendChild(el('div', { class: 'row', style: 'margin-top:8px' },
      isOpen ? button('Close now', '', function () { run('closeQuestion', [sel.id], 'The question is closed.'); }) : null,
      button(isOpen ? 'Extend by' : 'Reopen for', 'plain', function () { run('extendQuestion', [sel.id, Number(more.value)], isOpen ? 'Extended.' : 'The question is open again.'); }),
      el('label', {}, more, ' min'),
      el('span', { class: 'muted', text: '·' }),
      el('label', {}, 'Correct answer: ', setC), button('Set', 'plain', function () { run('setCorrect', [sel.id, setC.value], 'Saved.'); }),
      el('span', { class: 'muted', text: '·' }),
      button('Delete', 'danger', function () {
        ask('Delete ' + qLabel(sel, idx) + '?', ['The question and its ' + ans.length + ' answers are deleted.'], 'Delete', true)
          .then(function (yes) { if (yes) { qSel = ''; run('deleteQuestion', [sel.id], 'Question deleted.'); } });
      })));
    var at = el('table', {}, el('tr', {}, el('th', { text: 'Student' }), el('th', { text: 'Answer' }), el('th', { text: 'Time' })));
    var byMailA = {}; ans.forEach(function (a) { byMailA[a.email] = a; });
    roster.forEach(function (r) {
      var a = byMailA[r.email];
      at.appendChild(el('tr', {}, el('td', { text: fullName(r) }),
        el('td', { style: (a && sel.correct ? 'font-weight:600; color:' + (isRight(sel, a.answer) ? 'var(--ok)' : 'var(--warn)') + ';' : '') + (sel.kind === 'open' ? ' white-space:pre-wrap; max-width:360px' : ''), text: a ? a.answer : '' }),
        el('td', { class: 'muted', text: a ? isoClock(a.time) : '' })));
    });
    ans.filter(function (a) { return !byMail[a.email]; }).forEach(function (a) {  // answers of students since removed from the roster
      at.appendChild(el('tr', {}, el('td', { class: 'muted', text: a.email }), el('td', { text: a.answer }), el('td', { class: 'muted', text: isoClock(a.time) })));
    });
    card.appendChild(el('div', { class: 'scroll', style: 'margin-top:10px; max-width:640px' }, at));

    // history
    card.appendChild(el('h2', { text: 'All questions (' + S.questions.length + ')', style: 'margin-top:18px' }));
    var ht = el('table', {}, el('tr', {}, el('th', { text: '#' }), el('th', { text: 'Asked' }), el('th', { text: 'Type' }), el('th', { text: 'Text' }), el('th', { text: 'Correct' }), el('th', { text: 'Answered' }), el('th', { text: 'Right' }), el('th', {})));
    S.questions.slice().reverse().forEach(function (q) {
      var i = S.questions.indexOf(q), a = answersOf(q.id);
      ht.appendChild(el('tr', { style: q === sel ? 'background:#eef4fb' : '' },
        el('td', { text: 'Q' + (i + 1) }), el('td', { text: isoClock(q.opened) + (isOpenQ(q) ? ' (open)' : '') }),
        el('td', { text: KIND_NAMES[q.kind] + (q.kind === 'mc' ? ' (' + q.n + ')' : '') }),
        el('td', { style: 'white-space:normal; max-width:360px', text: q.text }), el('td', { text: q.correct }),
        el('td', { text: a.length + ' / ' + roster.length }),
        el('td', { text: q.correct ? String(a.filter(function (x) { return isRight(q, x.answer); }).length) : '' }),
        el('td', {}, q === sel ? null : el('button', { class: 'link', text: 'Show', on: { click: function () { qSel = q.id; render(); } } }))));
    });
    card.appendChild(el('div', { class: 'scroll' }, ht));
    card.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, button('Download answers CSV', 'plain', function () {
      var head = ['Last name', 'First name', 'Email'].concat(S.questions.map(function (q, i) { return 'Q' + (i + 1) + ' ' + isoClock(q.opened); }), ['Answered', 'Right']);
      var rows = [head].concat(roster.map(function (r) {
        var cells = S.questions.map(function (q) { var a = answersOf(q.id).filter(function (x) { return x.email === r.email; })[0]; return a ? a.answer : ''; });
        return [r.last, r.first, r.email].concat(cells, [cells.filter(Boolean).length,
          S.questions.filter(function (q, i) { return isRight(q, cells[i]); }).length]);
      }));
      rows.push(['Correct answer', '', ''].concat(S.questions.map(function (q) { return q.correct; })));
      rows.push(['Text', '', ''].concat(S.questions.map(function (q) { return q.text; })));
      download('answers_' + cur + '_' + D.today + '.csv', rows);
    })));
  }

  // ---- Roster
  function roster(card) {
    var S = D.state;
    card.appendChild(el('h2', { text: 'Roster (' + S.roster.length + ')' }));
    var file = el('input', { type: 'file', accept: '.csv,text/csv' });
    card.appendChild(el('p', { class: 'muted', text: 'The Canvas gradebook export ("Student" as "Last, First" and "SIS Login ID"; the Points Possible row and the test student are skipped), or a CSV with first name, last name, and email columns. Addresses at mail.montclair.edu are stored as montclair.edu; students may sign in with either. Importing replaces the roster; marks of students who are dropped are kept in the database but no longer shown.' }));
    card.appendChild(el('div', { class: 'row' }, file, button('Import', '', function () {
      if (!file.files.length) { flash = { err: 'Choose a CSV file first.' }; render(); return; }
      ask('Replace the roster?', ['The current ' + S.roster.length + ' students are replaced by the file\'s rows.'], 'Import', S.roster.length > 0).then(function (yes) {
        if (!yes) return;
        var reader = new FileReader();
        reader.onload = function () { run('importRoster', [String(reader.result)], 'Roster imported.'); };
        reader.readAsText(file.files[0]);
      });
    })));
    var aFirst = el('input', { type: 'text', placeholder: 'first name', size: 14 }), aLast = el('input', { type: 'text', placeholder: 'last name', size: 14 });
    var aMail = el('input', { type: 'text', placeholder: 'email or Montclair login ID', size: 26 });
    card.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, el('span', { class: 'muted', text: 'Add one student:' }), aFirst, aLast, aMail,
      button('Add', 'plain', function () { run('addStudent', [aFirst.value, aLast.value, aMail.value], 'Student added.'); })));
    if (!S.roster.length) return;
    var t = el('table', {}, el('tr', {}, el('th', { text: 'Last name' }), el('th', { text: 'First name' }), el('th', { text: 'Email' }), el('th', {})));
    S.roster.forEach(function (r) {
      t.appendChild(el('tr', {}, el('td', { text: r.last }), el('td', { text: r.first }), el('td', { text: r.email }),
        el('td', {}, button('Remove', 'danger', function () {
          ask('Remove ' + fullName(r) + '?', ['The student can no longer mark attendance. Existing marks stay in the database but are no longer shown.'], 'Remove', true)
            .then(function (yes) { if (yes) run('removeStudent', [r.email], fullName(r) + ' removed.'); });
        }))));
    });
    card.appendChild(t);
  }

  boot();
</script>
