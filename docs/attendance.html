<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
    .banner { padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .big { display: block; width: 100%; padding: 26px 16px; font-size: 24px; font-weight: 700; border: 0; border-radius: 12px;
           color: #fff; cursor: pointer; background: linear-gradient(135deg, #1a7f37, #3aa85a); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
    .big:disabled { opacity: .6; cursor: default; }
    .codelabel { text-align: center; margin: 0 0 6px; color: var(--muted); }
    .code { display: block; width: 180px; margin: 0 auto 14px; padding: 10px; font-size: 32px; letter-spacing: 10px; text-align: center;
            border: 2px solid var(--line); border-radius: 10px; font-family: inherit; }
    .code:focus { border-color: var(--accent); outline: none; }
    .done { padding: 26px 16px; border-radius: 12px; background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4;
            font-size: 22px; font-weight: 700; text-align: center; }
    .standby { padding: 22px 16px; border-radius: 12px; background: #f0f2f5; color: var(--muted); text-align: center; font-size: 18px; }
    .standby b { display: block; color: var(--ink); margin-top: 6px; font-weight: 600; }
    .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px;
             animation: pulse 1.6s ease-in-out infinite; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .qcard { border-color: var(--accent); }
    .qtext { font-size: 20px; font-weight: 600; margin: 0 0 12px; white-space: pre-wrap; }
    .choices { display: grid; gap: 10px; }
    .choice { padding: 20px 16px; font-size: 24px; font-weight: 700; border: 2px solid var(--line); border-radius: 12px;
              background: #fff; color: var(--ink); cursor: pointer; }
    .choice.picked { border-color: var(--accent); background: #e7f0fb; color: var(--accent); }
    .choice.right { border-color: var(--ok); background: #e8f5ec; color: var(--ok); }
    .choice.wrong { border-color: var(--warn); background: #fdecea; color: var(--warn); }
    .choice:disabled { cursor: default; }
    .choice.submit { display: block; width: 100%; margin-top: 10px; color: #fff; background: var(--accent); border-color: var(--accent); }
    .choice.shown { font-size: 20px; font-weight: 600; white-space: pre-wrap; cursor: default; }
    .answer { display: block; width: 100%; padding: 12px; font: inherit; font-size: 20px; border: 2px solid var(--line); border-radius: 12px; resize: vertical; }
    .answer:focus { border-color: var(--accent); outline: none; }
    .qnote { margin-top: 10px; text-align: center; }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font: inherit; cursor: pointer; }
    #signin { margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<script>
  // The class is chosen by the link (?c=key).
  var API = (window.SIGNUP_API || '').replace(/\/+$/, '');
  var classKey = new URLSearchParams(location.search).get('c') || '';
  var TOKEN_KEY = 'attendance_token';
  var conf = null, token = '', S = null, busy = false, flash = '', timer = null;
  // The token is kept in localStorage: the Worker's session token (sent after a Google sign-in) lasts months,
  // so a student signs in with Google once and later only scans the QR code. "Sign out" deletes it.
  try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  tokenFromHash();

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function api(action, args) {
    return fetch(API + '/att', { method: 'POST', body: JSON.stringify({ token: token, class: classKey, action: action, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.session) setToken(out.session);
        if (out.ok) return out.state;
        if (out.error === 'SIGNIN') { setToken(''); S = null; showSignIn(); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  /** Loads the state and schedules the next reload for the moment the window opens or closes. */
  function load() {
    if (!token) return;
    api('state').then(function (s) { S = s; flash = ''; render(); schedule(); })
      .catch(function (e) { if (e.message !== 'SIGNIN') { flash = 'The page could not load. ' + e.message; render(); } });
  }

  // A hidden tab does not poll; it reloads when shown again.
  function schedule() {
    clearTimeout(timer);
    if (S && S.authorized) timer = setTimeout(function () { if (document.hidden) schedule(); else load(); }, Math.min(S.refreshIn || 30000, 30000));
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

  var codeDraft = '';  // the session code being typed; survives the page's refreshes
  function mark() {
    if (S.needCode && !/^\d{4}$/.test(codeDraft.trim())) { flash = 'Type the 4-digit session code shown by your instructor.'; render(); return; }
    busy = true; render();
    api('mark', [codeDraft.trim()]).then(function (s) { busy = false; S = s; flash = ''; codeDraft = ''; render(); schedule(); })
      .catch(function (e) {
        busy = false;
        if (e.message === 'SIGNIN') return;
        if (/^Wrong session code/.test(e.message)) codeDraft = '';  // the code on the screen has changed by now: type the new one
        flash = e.message; load();
      });
  }

  function answer(id, label) {
    busy = true; render();
    api('answer', [id, label]).then(function (s) { busy = false; S = s; flash = ''; render(); schedule(); })
      .catch(function (e) { busy = false; if (e.message !== 'SIGNIN') { flash = e.message; load(); } });
  }

  // The text typed for an open question; survives the page's refreshes, cleared once the answer is recorded.
  var textDraft = { id: '', text: '' };
  function submitText(q) {
    var t = textDraft.text.trim();
    if (!t) { flash = 'Type an answer first.'; render(); return; }
    busy = true; render();
    api('answer', [q.id, t]).then(function (s) { busy = false; S = s; flash = ''; textDraft = { id: '', text: '' }; render(); schedule(); })
      .catch(function (e) { busy = false; if (e.message !== 'SIGNIN') { flash = e.message; load(); } });
  }

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  function showSignIn() {
    var app = document.getElementById('app');
    var box = document.getElementById('signin');
    app.innerHTML = '';
    app.appendChild(el('h1', { text: conf.title }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with the Google account of the email address your instructor has on file (your university account, not a personal Gmail). You sign in once; this browser stays signed in afterwards.' }));
    box.hidden = false;
    box.innerHTML = '';
    whenGoogleReady(function () { google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' }); });
    box.appendChild(el('p', { class: 'muted', style: 'margin-top:14px' }, 'Signed in to a personal account on this phone or computer? ',
      el('button', { class: 'link', text: 'Choose or add the university account', on: { click: chooseAccount } }), '.'));
  }

  /**
   * Google's account chooser in this tab, for a browser whose only Google account is the wrong one: the
   * "Sign in with Google" button then signs in with that account without asking. Google returns to this
   * page with the ID token in the URL fragment (tokenFromHash); the page's address must be registered as
   * an authorized redirect URI of the client ID.
   */
  function chooseAccount() {
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('signin_nonce', nonce); } catch (e) {}
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
      client_id: conf.clientId, redirect_uri: location.origin + location.pathname, response_type: 'id_token',
      scope: 'openid email', nonce: nonce, prompt: 'select_account', state: classKey }).toString();
  }

  function tokenFromHash() {
    var h = new URLSearchParams(location.hash.replace(/^#/, ''));
    var t = h.get('id_token');
    if (!t) return;
    var nonce = '';
    try { nonce = sessionStorage.getItem('signin_nonce') || ''; sessionStorage.removeItem('signin_nonce'); } catch (e) {}
    var p = {};
    try { var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); p = JSON.parse(atob(b + '==='.slice(0, (4 - b.length % 4) % 4))); } catch (e) {}
    if (!classKey) classKey = h.get('state') || '';
    if (nonce && p.nonce === nonce) setToken(t);
    history.replaceState(null, '', location.pathname + (classKey ? '?c=' + encodeURIComponent(classKey) : ''));
  }

  function signOut() {
    setToken(''); S = null; clearTimeout(timer);
    whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
    showSignIn();
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/att/config').then(function (r) { return r.json(); }).then(function (c) {
      conf = c;
      var chosen = c.classes.filter(function (x) { return x.key === classKey; })[0] ||
                   (!classKey && c.classes.length === 1 ? c.classes[0] : null);
      if (!chosen) {
        app.innerHTML = '';
        app.appendChild(el('h1', { text: 'Attendance' }));
        if (classKey) app.appendChild(el('div', { class: 'banner err', text: 'This link does not match any class. Check the link your instructor posted.' }));
        else if (!c.classes.length) app.appendChild(el('div', { class: 'banner err', text: 'No class is configured yet.' }));
        else app.appendChild(el('p', { text: 'Choose your class:' }));
        var list = el('ul');
        if (!classKey) c.classes.forEach(function (x) {
          list.appendChild(el('li', {}, el('a', { href: '?c=' + encodeURIComponent(x.key), text: x.title || x.key })));
        });
        app.appendChild(list);
        return;
      }
      classKey = chosen.key;
      conf.title = chosen.title;
      document.title = conf.title + ' attendance';
      whenGoogleReady(function () {
        google.accounts.id.initialize({
          client_id: conf.clientId,
          callback: function (resp) { setToken(resp.credential); document.getElementById('signin').hidden = true; load(); }
        });
      });
      if (token) load(); else showSignIn();
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The attendance service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- rendering

  var NY = 'America/New_York';
  function clock(hhmm) {  // '07:50' -> '7:50 am'
    var h = Number(hhmm.split(':')[0]), m = hhmm.split(':')[1];
    return ((h + 11) % 12 + 1) + ':' + m + (h < 12 ? ' am' : ' pm');
  }
  function longDate(ymd) {
    return new Intl.DateTimeFormat('en-US', { timeZone: NY, weekday: 'long', month: 'long', day: 'numeric' }).format(new Date(ymd + 'T12:00:00-05:00'));
  }
  function isoClock(iso) {
    return new Intl.DateTimeFormat('en-US', { timeZone: NY, hour: 'numeric', minute: '2-digit' }).format(new Date(iso)).toLowerCase();
  }

  function render() {
    var app = document.getElementById('app');
    app.innerHTML = '';
    if (!S) { app.appendChild(el('p', { class: flash ? 'banner err' : 'muted', text: flash || 'Loading...' })); return; }
    document.getElementById('signin').hidden = true;
    var signOutLink = el('button', { class: 'link', text: 'Sign out', on: { click: signOut } });
    app.appendChild(el('h1', { text: S.title }));
    if (!S.authorized) {
      app.appendChild(el('div', { class: 'banner err',
        text: 'The account ' + S.email + ' is not on the class roster. Sign in with the account of the email address your instructor has on file, or contact your instructor.' }));
      app.appendChild(el('p', {}, signOutLink));
      return;
    }
    app.appendChild(el('p', { class: 'muted' }, S.name + ' (' + S.email + '). ', signOutLink));
    if (flash) app.appendChild(el('div', { class: 'banner err', text: flash }));
    var q = S.question;
    // Attendance card: the button while a round is open, the mark once made in that round; earlier marks of the day below.
    var earlier = S.today.filter(function (t) { return t !== S.marked; });
    if (S.open && !S.marked) {
      var card = el('div', { class: 'card' });
      if (S.needCode) {
        // The refresh redraws the page; the typed digits are kept and the field keeps the focus.
        var hadFocus = document.activeElement && document.activeElement.id === 'code';
        var code = el('input', { id: 'code', class: 'code', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 4, autocomplete: 'off', placeholder: '0000' });
        code.value = codeDraft;
        code.addEventListener('input', function () { codeDraft = code.value.replace(/\D/g, '').slice(0, 4); code.value = codeDraft; });
        code.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') mark(); });
        card.appendChild(el('p', { class: 'codelabel', text: 'Session code (on the screen, next to the QR code; it changes every 6 seconds):' }));
        card.appendChild(code);
        if (hadFocus) setTimeout(function () { code.focus(); code.setSelectionRange(code.value.length, code.value.length); }, 0);
      }
      card.appendChild(el('button', { class: 'big', disabled: busy, text: busy ? 'Recording...' : 'I am here', on: { click: mark } }));
      card.appendChild(el('p', { class: 'muted qnote', text: 'Attendance closes at ' + clock(S.open.close) + '.' }));
      app.appendChild(card);
    } else if (S.marked) {
      app.appendChild(el('div', { class: 'card' },
        el('div', { class: 'done', text: '✓ Present, ' + longDate(S.date) + ', ' + isoClock(S.marked) })));
    }
    if (earlier.length) {
      app.appendChild(el('p', { class: 'muted', style: 'margin-top:10px', text: (S.marked || (S.open && !S.marked) ? 'Earlier today: ' : 'Recorded today: ') + earlier.map(isoClock).join(', ') + '.' }));
    }
    // Question card: big answer buttons while open, the result for a few minutes after it closes.
    if (q) {
      var qc = el('div', { class: 'card qcard' });
      qc.appendChild(el('p', { class: 'muted', style: 'margin:0 0 6px', text: q.open ? 'Question (closes at ' + isoClock(q.closes) + ')' : 'Question closed' }));
      if (q.text) qc.appendChild(el('p', { class: 'qtext', text: q.text }));
      var note;
      if (q.kind === 'open') {
        // Open answer: a text box and a Submit button while open; the box keeps its text and focus across refreshes.
        if (q.open) {
          if (textDraft.id !== q.id) textDraft = { id: q.id, text: '' };
          var hadFocusT = document.activeElement && document.activeElement.id === 'answer';
          var box = el('textarea', { id: 'answer', class: 'answer', rows: 2, maxlength: 500, placeholder: q.answered ? 'Type a new answer to replace yours' : 'Type your answer' });
          box.value = textDraft.text;
          box.addEventListener('input', function () { textDraft.text = box.value; });
          box.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); submitText(q); } });
          qc.appendChild(box);
          if (hadFocusT) setTimeout(function () { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }, 0);
          qc.appendChild(el('button', { class: 'choice submit', disabled: busy, text: busy ? 'Sending...' : (q.answered ? 'Replace my answer' : 'Submit'),
            on: { click: function () { submitText(q); } } }));
        } else if (q.answered) {
          qc.appendChild(el('div', { class: 'choice ' + (q.correct ? (q.right ? 'right' : 'wrong') : 'picked') + ' shown', text: q.answered }));
        }
        if (q.open) note = q.answered ? 'Your answer: ' + q.answered + '. You can replace it until the question closes.' : 'Type your answer and press Submit.';
        else if (!q.answered) note = 'You did not answer.';
        else if (q.correct) note = q.right ? 'Correct.' : 'Correct answer: ' + q.correct + '.';
        else note = 'Your answer was recorded.';
      } else {
        var grid = el('div', { class: 'choices', style: q.options.length <= 2 ? 'grid-template-columns:1fr 1fr' : '' });
        q.options.forEach(function (o) {
          var cls = 'choice';
          if (!q.open && q.correct) cls += o === q.correct ? ' right' : (o === q.answered ? ' wrong' : '');
          else if (o === q.answered) cls += ' picked';
          grid.appendChild(el('button', { class: cls, disabled: busy || !q.open, text: o,
            on: { click: function () { if (q.open && o !== q.answered) answer(q.id, o); } } }));
        });
        qc.appendChild(grid);
        if (q.open) note = q.answered ? 'Your answer: ' + q.answered + '. You can change it until the question closes.' : 'Choose one answer.';
        else if (!q.answered) note = 'You did not answer.';
        else if (q.correct) note = q.answered === q.correct ? 'Correct.' : 'Your answer: ' + q.answered + '. Correct answer: ' + q.correct + '.';
        else note = 'Your answer: ' + q.answered + '.';
      }
      qc.appendChild(el('p', { class: 'muted qnote', text: note }));
      app.appendChild(qc);
    }
    // Standby when nothing is going on.
    if (!(S.open && !S.marked) && !(q && q.open)) {
      var sb = el('div', { class: 'card' });
      sb.appendChild(el('div', { class: 'standby' }, el('span', { class: 'pulse' }), 'Waiting for your instructor.',
        el('b', { text: S.open ? 'Attendance is open until ' + clock(S.open.close) + '.' :
                        S.next ? 'Next attendance: ' + longDate(S.next.date) + ', ' + clock(S.next.open) + ' to ' + clock(S.next.close) + '.' :
                        'No upcoming class is scheduled.' })));
      app.appendChild(sb);
    }
    app.appendChild(el('p', { class: 'muted', style: 'margin-top:12px', text: 'Keep this page open during class: it updates itself when attendance opens or a question is asked. Times are New York time.' }));
  }

  boot();
</script>
</body>
</html>
