<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 14px; color: #222; }
    p { margin: 0 0 12px; }
    #msg { margin-top: 12px; }
    .err { color: #b3261e; }
  </style>
</head>
<body>
  <p>Choose a CSV file with a header row and columns for first name, last name, and email.</p>
  <p>The file replaces the current roster. Students who remain keep their group.</p>
  <input type="file" id="file" accept=".csv,text/csv">
  <button id="go">Import</button>
  <div id="msg"></div>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('go').onclick = function () {
      const f = document.getElementById('file').files[0];
      if (!f) { msg.className = 'err'; msg.textContent = 'Choose a file first.'; return; }
      msg.className = ''; msg.textContent = 'Importing...';
      const reader = new FileReader();
      reader.onload = function () {
        google.script.run
          .withSuccessHandler(function (s) { msg.className = ''; msg.textContent = s; })
          .withFailureHandler(function (e) { msg.className = 'err'; msg.textContent = e.message; })
          .importRoster(reader.result);
      };
      reader.readAsText(f);
    };
  </script>
</body>
</html>
